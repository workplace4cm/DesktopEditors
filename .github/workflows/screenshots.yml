name: Install screenshots

# Installs the packages built by a "Build Secure Office Suite" run and drives
# the app with OCR-guided clicks: start page, About, and the Insert/View tabs,
# File menu and Advanced Settings of every editor.
# Ubuntu: the .deb is installed with dpkg -i, without network, into a container
# holding the package set of the official Ubuntu desktop ISO.
# Results are pushed to the screenshots-results-* branches.

on:
  push:
    branches: [screenshots]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose packages to install
        required: true

env:
  BUILD_RUN_ID: ${{ inputs.run_id || '38252903829' }}
  TRIAL: '1'

permissions:
  contents: write
  actions: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '22.04'
            manifest: https://releases.ubuntu.com/22.04/ubuntu-22.04.5-desktop-amd64.manifest
          - ubuntu: '24.04'
            manifest: https://releases.ubuntu.com/24.04/ubuntu-24.04.3-desktop-amd64.manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: build/screenshots
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-secure-office-suite-amd64
          path: pkg
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Build a stock Ubuntu ${{ matrix.ubuntu }} desktop image
        run: |
          docker build -q -t stock build/screenshots \
            --build-arg UBUNTU=${{ matrix.ubuntu }} \
            --build-arg MANIFEST_URL=${{ matrix.manifest }} \
            --build-arg TRIAL=${TRIAL}

      - name: Install the .deb offline and take screenshots
        run: |
          mkdir -p out
          docker run --rm --network none -e TRIAL=${TRIAL} \
            -v $PWD/pkg:/pkg:ro -v $PWD/build/screenshots:/tools:ro -v $PWD/out:/out \
            stock bash /tools/linux-test.sh
          cat out/RESULT out/dpkg-install.log

      - name: Push results
        if: always()
        run: |
          sudo chown -R $(id -u) out
          cd out
          git init -q -b r
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Ubuntu ${{ matrix.ubuntu }} install screenshots for run ${BUILD_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:screenshots-results-ubuntu-${{ matrix.ubuntu }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages-secure-office-suite-amd64
          path: pkg
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Run the installer and screenshot each page
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force out | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          Get-ChildItem -Recurse pkg | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Set-Content out\artifact-files.txt
          $exe = Get-ChildItem -Recurse pkg -Filter *.exe | Select-Object -First 1
          "installer: $($exe.FullName)" | Add-Content out\report.txt
          $vi = (Get-Item $exe.FullName).VersionInfo
          "installer CompanyName: $($vi.CompanyName)`ninstaller ProductName: $($vi.ProductName)`ninstaller FileDescription: $($vi.FileDescription)`ninstaller LegalCopyright: $($vi.LegalCopyright)" | Add-Content out\report.txt
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 2
          $p = Start-Process $exe.FullName -PassThru
          $ws = New-Object -ComObject WScript.Shell
          Start-Sleep 8
          # language, welcome, licence (accept), tasks, file types, ready to install
          $pages = @(@("{ENTER}"), @("{ENTER}"), @("%a", "{ENTER}"), @("{ENTER}"), @("{ENTER}"), @("{ENTER}"))
          $n = 0
          foreach ($keys in $pages) {
            $n++
            $null = $ws.AppActivate($p.Id); Start-Sleep 2
            Shot ("windows-installer-{0:D2}" -f $n)
            foreach ($k in $keys) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep 1 }
            Start-Sleep 4
          }
          Start-Sleep 20
          $n++; Shot ("windows-installer-{0:D2}-installing" -f $n)
          # Inno writes the uninstall registry entry at the very end of installing
          function Installed { Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'Secure Office Suite' } }
          for ($t = 0; $t -lt 90 -and -not (Installed); $t++) { Start-Sleep 10 }
          "install finished after about $($t * 10 + 20)s" | Add-Content out\report.txt
          Start-Sleep 20
          $null = $ws.AppActivate($p.Id); Start-Sleep 2
          $n++; Shot ("windows-installer-{0:D2}-finished" -f $n)
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep 15
          "installer exited: $($p.HasExited) code: $(if ($p.HasExited) { $p.ExitCode })" | Add-Content out\report.txt

      - uses: actions/checkout@v4
        with:
          sparse-checkout: build/screenshots
          submodules: false
          path: src

      - name: Drive the app and take screenshots
        shell: pwsh
        run: |
          $r = "out\report.txt"
          choco install tesseract -y --no-progress | Out-Null
          python -m pip install -q pillow
          $dir = (Get-ChildItem "$env:ProgramFiles" -Directory | Where-Object { $_.Name -match 'Secure Office Suite' })
          $app = Get-ChildItem -Recurse $dir.FullName -Filter DesktopEditors.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $vi = $app.VersionInfo
          "app exe: $($app.FullName)`napp ProductName: $($vi.ProductName)`napp LegalCopyright: $($vi.LegalCopyright)" | Add-Content $r
          Get-Process | Where-Object { $_.Path -like "$($dir.FullName)*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 2
          python src\build\screenshots\drive.py out\shots "$($app.FullName)"

      - name: Push results
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b screenshots-results-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Windows install screenshots for run ${BUILD_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:screenshots-results-windows
