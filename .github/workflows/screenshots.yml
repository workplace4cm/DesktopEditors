name: Install screenshots

# Installs the packages built by a "Build CenOffice" run on clean runners,
# screenshots the installer and the app, and checks what users see for
# ONLYOFFICE / Euro-Office branding. Results are pushed to the
# screenshots-results-linux and screenshots-results-windows branches.

on:
  push:
    branches: [screenshots]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose packages to install
        required: true

env:
  BUILD_RUN_ID: ${{ inputs.run_id || '37890034927' }}

permissions:
  contents: write
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-cenoffice-amd64
          path: pkg
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install the .deb
        run: |
          set -x
          ls -la pkg
          DEB=$(ls pkg/*.deb | grep -v -- -help | head -1)
          mkdir -p out
          dpkg-deb -I "$DEB" > out/deb-info.txt
          sudo apt-get update -q
          sudo apt-get install -y -q "./$DEB" xvfb x11-apps imagemagick xdotool openbox libopengl0 libegl1 libgl1 libgbm1 libnss3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xkb1 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1 libxcb-glx0 libxcb-render0 libxkbcommon-x11-0 libx11-xcb1 libxrender1 libxi6 libsm6 libice6 libfontconfig1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 > out/apt.log 2>&1 || (tail -50 out/apt.log; exit 1)
          dpkg -L $(dpkg-deb -f "$DEB" Package) > out/installed-files.txt
          ls /usr/share/applications/ | grep -i -E "cen|office|euro" > out/desktop-files.txt || true
          for f in /opt/cenoffice/desktopeditors/platforms/libqxcb.so /opt/cenoffice/desktopeditors/DesktopEditors; do echo "== $f"; ldd "$f" | grep "not found"; done > out/missing-libs.txt 2>&1 || true
          for f in /usr/share/applications/*cenoffice*.desktop; do echo "== $f"; cat "$f"; done > out/desktop-entry.txt 2>&1 || true

      - name: Screenshot the app
        run: |
          set -x
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 3
          openbox &
          sleep 2
          BIN=$(ls /usr/bin/ | grep -i cenoffice | head -1)
          echo "launcher: $BIN" >> out/desktop-files.txt
          export QT_DEBUG_PLUGINS=1
          "$BIN" > out/app.log 2>&1 &
          sleep 40
          W=$(xdotool search --onlyvisible --name "CenOffice|Desktop Editors" | head -1)
          [ -n "$W" ] && xdotool windowmove "$W" 0 0 windowsize "$W" 1600 1000 && sleep 3
          import -window root out/linux-1-start-page.png
          xdotool search --onlyvisible --name "" getwindowname %@ > out/window-titles.txt 2>&1 || true
          # About sits at the bottom of the left panel
          xdotool mousemove 60 967 click 1 && sleep 5
          import -window root out/linux-2-about.png
          pkill -f "$BIN" || true
          pkill -f /opt/cenoffice || true
          sleep 3
          "$BIN" --new:word > out/app-word.log 2>&1 &
          sleep 45
          W=$(xdotool search --onlyvisible --name "CenOffice|Desktop Editors|docx" | head -1)
          [ -n "$W" ] && xdotool windowmove "$W" 0 0 windowsize "$W" 1600 1000 && sleep 3
          import -window root out/linux-3-new-document.png
          xdotool search --onlyvisible --name "" getwindowname %@ >> out/window-titles.txt 2>&1 || true

      - name: Scan installed files for old brand names
        run: |
          D=/opt/cenoffice
          echo "install dir: $D" > out/brand-scan.txt
          for term in ONLYOFFICE "Euro-?Office|Euro Office"; do
            n=$(grep -rIl -i -E -- "$term" $D /usr/share/applications/cenoffice* /usr/bin/cenoffice* 2>/dev/null | wc -l)
            echo "files mentioning '$term': $n" >> out/brand-scan.txt
          done
          echo "--- files mentioning ONLYOFFICE (first 60) ---" >> out/brand-scan.txt
          grep -rIl -i onlyoffice $D 2>/dev/null | head -60 >> out/brand-scan.txt
          echo "--- files mentioning Euro-Office (first 60) ---" >> out/brand-scan.txt
          grep -rIl -i -E "euro-?office|euro office" $D 2>/dev/null | head -60 >> out/brand-scan.txt

      - name: Push results
        if: always()
        run: |
          cd out
          git init -q -b screenshots-results-linux
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Linux install screenshots for run ${BUILD_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:screenshots-results-linux

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages-cenoffice-amd64
          path: pkg
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Run the installer and screenshot each page
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force out | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          Get-ChildItem -Recurse pkg | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Set-Content out\artifact-files.txt
          $exe = Get-ChildItem -Recurse pkg -Filter *.exe | Select-Object -First 1
          "installer: $($exe.FullName)" | Add-Content out\report.txt
          $vi = (Get-Item $exe.FullName).VersionInfo
          "installer CompanyName: $($vi.CompanyName)`ninstaller ProductName: $($vi.ProductName)`ninstaller FileDescription: $($vi.FileDescription)`ninstaller LegalCopyright: $($vi.LegalCopyright)" | Add-Content out\report.txt
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 2
          $p = Start-Process $exe.FullName -PassThru
          $ws = New-Object -ComObject WScript.Shell
          Start-Sleep 8
          # language, welcome, licence (accept), tasks, file types, ready to install
          $pages = @(@("{ENTER}"), @("{ENTER}"), @("%a", "{ENTER}"), @("{ENTER}"), @("{ENTER}"), @("{ENTER}"))
          $n = 0
          foreach ($keys in $pages) {
            $n++
            $null = $ws.AppActivate($p.Id); Start-Sleep 2
            Shot ("windows-installer-{0:D2}" -f $n)
            foreach ($k in $keys) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep 1 }
            Start-Sleep 4
          }
          Start-Sleep 20
          $n++; Shot ("windows-installer-{0:D2}-installing" -f $n)
          # Inno writes the uninstall registry entry at the very end of installing
          function Installed { Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'CenOffice' } }
          for ($t = 0; $t -lt 90 -and -not (Installed); $t++) { Start-Sleep 10 }
          "install finished after about $($t * 10 + 20)s" | Add-Content out\report.txt
          Start-Sleep 20
          $null = $ws.AppActivate($p.Id); Start-Sleep 2
          $n++; Shot ("windows-installer-{0:D2}-finished" -f $n)
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep 15
          "installer exited: $($p.HasExited) code: $(if ($p.HasExited) { $p.ExitCode })" | Add-Content out\report.txt

      - name: Check what Windows shows for the installed app
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $r = "out\report.txt"
          "--- Uninstall entries (Apps & features) ---" | Add-Content $r
          Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'office|cen|euro' } |
            ForEach-Object { "DisplayName: $($_.DisplayName) | Publisher: $($_.Publisher) | InstallLocation: $($_.InstallLocation)" } | Add-Content $r
          "--- Start menu and desktop shortcuts ---" | Add-Content $r
          Get-ChildItem -Recurse "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:PUBLIC\Desktop", "$env:USERPROFILE\Desktop" -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'office|cen|euro' } | ForEach-Object { $_.FullName } | Add-Content $r
          $dir = (Get-ChildItem "$env:ProgramFiles" -Directory | Where-Object { $_.Name -match 'CenOffice|Euro|ONLYOFFICE' })
          "--- Program Files folders ---" | Add-Content $r
          $dir | ForEach-Object { $_.FullName } | Add-Content $r
          $app = Get-ChildItem -Recurse $dir.FullName -Filter DesktopEditors.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($app) {
            $vi = $app.VersionInfo
            "app exe: $($app.FullName)`napp CompanyName: $($vi.CompanyName)`napp ProductName: $($vi.ProductName)`napp FileDescription: $($vi.FileDescription)`napp LegalCopyright: $($vi.LegalCopyright)" | Add-Content $r
            Get-Process | Where-Object { $_.Path -like "$($dir.FullName)*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
            (New-Object -ComObject Shell.Application).MinimizeAll()
            Start-Sleep 2
            Start-Process $app.FullName
            Start-Sleep 45
            Shot "windows-app-1-start-page"
            Add-Type -Namespace W -Name M -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);'
            [W.M]::SetCursorPos(60, 695); [W.M]::mouse_event(2, 0, 0, 0, 0); [W.M]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep 5
            Shot "windows-app-2-about"
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.ProcessName) | $($_.MainWindowTitle)" } | Add-Content $r
            Get-Process | Where-Object { $_.Path -like "$($dir.FullName)*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
            Start-Process $app.FullName -ArgumentList "--new:word"
            Start-Sleep 45
            Shot "windows-app-3-new-document"
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.ProcessName) | $($_.MainWindowTitle)" } | Add-Content $r
          } else { "DesktopEditors.exe not found" | Add-Content $r }
          "--- files mentioning ONLYOFFICE / Euro-Office (names only, first 40 each) ---" | Add-Content $r
          if ($dir) {
            Get-ChildItem -Recurse $dir.FullName -Include *.js,*.json,*.html,*.txt,*.xml,*.ini -ErrorAction SilentlyContinue | Select-String -Pattern 'ONLYOFFICE' -List | Select-Object -First 40 | ForEach-Object { "ONLYOFFICE: $($_.Path)" } | Add-Content $r
            Get-ChildItem -Recurse $dir.FullName -Include *.js,*.json,*.html,*.txt,*.xml,*.ini -ErrorAction SilentlyContinue | Select-String -Pattern 'Euro-?Office|Euro Office' -List | Select-Object -First 40 | ForEach-Object { "EURO: $($_.Path)" } | Add-Content $r
          }

      - name: Push results
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b screenshots-results-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Windows install screenshots for run ${BUILD_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:screenshots-results-windows
