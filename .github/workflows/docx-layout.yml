name: DOCX layout (SmartArt and drawings)

# Opens the DOCX layout test cases (tests/docx-layout) in EuroOffice Writer
# from the Ubuntu package of a build run and records where every paragraph
# and drawing lands, what Enter and resizing do around a SmartArt, and the
# editor's JavaScript errors. Results: the job summary and the "docx-layout"
# artifact (layout.md / layout.json, screenshots, x2t round trips).

on:
  pull_request:
    paths:
      - tests/docx-layout/**
      - sdkjs
      - core
      - .github/workflows/docx-layout.yml
  workflow_dispatch:
    inputs:
      run-id:
        description: build.yml run whose Ubuntu package to test (empty = latest successful build)
        required: false

permissions:
  contents: write          # the docx-layout-results branch
  actions: read            # download the packages of another run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docx-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - name: Check out desktop-apps
        run: git submodule update --init --depth 1 desktop-apps

      - name: Find the build
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$RUN_ID
          if [ -z "$id" ] && [ -n "$HEAD_SHA" ]; then
            # a pull request is tested on its own build: wait for build.yml on its head commit
            for i in $(seq 1 100); do
              st=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$HEAD_SHA" -L 1 \
                     --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
              case "$st" in
                *" completed success") id=${st%% *}; break ;;
                *" completed "*) echo "build.yml for $HEAD_SHA did not succeed: $st"; exit 1 ;;
              esac
              sleep 150
            done
          fi
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml \
                 --status success -L 1 --json databaseId -q '.[0].databaseId')
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Package from build run $id: $(gh run view -R "$GITHUB_REPOSITORY" "$id" --json headBranch,headSha,displayTitle \
                 -q '"\(.headBranch) \(.headSha[0:7]) \(.displayTitle)"')" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-secure-office-suite-amd64
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: packages

      - name: Install the package, a virtual display and the test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool x11-utils x11-xserver-utils imagemagick \
               python3-websocket dbus-x11 libglib2.0-bin >/dev/null
          deb=$(ls packages/*.deb | grep -v -- -help | head -1)
          sudo apt-get install -y -qq "./$deb" >/dev/null
          dpkg -s libpulse0 >/dev/null 2>&1 || sudo apt-get install -y -qq libpulse0 >/dev/null
          sudo useradd -m -s /bin/bash qa
          # the test user cannot read the workspace under /home/runner
          sudo mkdir -p /opt/docx-qa && sudo cp -r desktop-apps/tools/sos-apps/regression tests/docx-layout /opt/docx-qa/
          sudo chmod -R a+rX /opt/docx-qa
          sudo mkdir -p /tmp/out/cases /tmp/out/x2t && sudo chown -R qa /tmp/out && sudo chmod a+rwx /tmp/out/x2t
          sudo -u qa python3 /opt/docx-qa/docx-layout/make_cases.py /tmp/out/cases

      - name: Round-trip the cases through x2t
        run: |
          x2t=$(ls /opt/*/desktopeditors/converter/x2t | head -1)
          cd /tmp/out/x2t
          for f in /tmp/out/cases/*.docx; do
            n=$(basename "$f" .docx)
            sudo -u qa "$x2t" "$f" "$PWD/$n.roundtrip.docx" > "$n.log" 2>&1 || echo "x2t $n exit $?" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -f "$n.roundtrip.docx" ]; then
              mkdir -p "$n" && unzip -o -q "$n.roundtrip.docx" -d "$n"
              echo "$n: $(ls "$n/word/diagrams" 2>/dev/null | tr '\n' ' ')" >> diagrams.txt
            fi
          done
          cat diagrams.txt || true

      - name: Open the cases in Writer
        run: |
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 & sleep 3
          export DISPLAY=:99
          openbox >/dev/null 2>&1 & sleep 2
          xhost +SI:localuser:qa
          sudo -u qa -H env DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb NO_AT_BRIDGE=1 \
               PYTHONPATH=/opt/docx-qa/regression SOS_OUT=/tmp/out \
               dbus-run-session -- python3 /opt/docx-qa/docx-layout/probe.py /tmp/out /tmp/out/cases/*.docx \
            && status=0 || status=$?
          cat /tmp/out/layout.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Make the results readable
        if: always()
        run: |
          sudo chmod -R a+rX /tmp/out || true
          # what x2t makes of the file Writer saved
          if [ -f /tmp/out/cases/01-sample.docx ]; then
            mkdir -p /tmp/saved && cd /tmp/saved
            unzip -o -q /tmp/out/cases/01-sample.docx -d saved && ls -R saved/word | tee /tmp/saved/listing.txt
            sudo cp -r /tmp/saved /tmp/out/saved-01
          fi

      # Screenshots and layout dumps on a branch of their own, so they can be
      # read without downloading the artifact.
      - name: Publish the results to the docx-layout-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          cp -r /tmp/out/shots /tmp/out/layout.md /tmp/out/layout.json . 2>/dev/null || true
          cp -r /tmp/out/saved-01 . 2>/dev/null || true
          git init -q -b docx-layout-results
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "docx-layout results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/docx-layout-results

  docx-layout-windows:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - name: Check out desktop-apps
        run: git submodule update --init --depth 1 desktop-apps

      - name: Find the build
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$RUN_ID
          if [ -z "$id" ] && [ -n "$HEAD_SHA" ]; then
            # a pull request is tested on its own build: wait for build.yml on its head commit
            for i in $(seq 1 100); do
              st=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$HEAD_SHA" -L 1 \
                     --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
              case "$st" in
                *" completed success") id=${st%% *}; break ;;
                *" completed "*) echo "build.yml for $HEAD_SHA did not succeed: $st"; exit 1 ;;
              esac
              sleep 150
            done
          fi
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml \
                 --status success -L 1 --json databaseId -q '.[0].databaseId')
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Installer from build run $id" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-packages-secure-office-suite-amd64
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: packages

      - name: Install the test tools and the suite
        shell: pwsh
        run: |
          python -m pip install --quiet websocket-client pywinauto psutil pillow
          $setup = Get-ChildItem packages -Recurse -Filter '*.exe' | Where-Object Name -notlike 'vc_redist*' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $p.WaitForExit(900000)) { throw "setup did not finish" }
          New-Item -Force -Path 'HKCU:\Software\Secure Office Suite\DesktopEditors' | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Secure Office Suite\DesktopEditors' -Name ignoreAssocMsg -Value 'true'
          python tests/docx-layout/make_cases.py "$env:RUNNER_TEMP\out\cases"

      - name: Open the cases in Writer
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\out"
          $env:PYTHONPATH = "$PWD\desktop-apps\tools\sos-apps\regression"
          $env:SOS_OUT = $out
          $cases = Get-ChildItem "$out\cases\*.docx" | ForEach-Object FullName
          python tests/docx-layout/probe.py $out @cases
          $status = $LASTEXITCODE
          Get-Content "$out\layout.md" -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $status

      - name: Publish the results to the docx-layout-results-windows branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          cp -r "$out/shots" "$out/layout.md" "$out/layout.json" . 2>/dev/null || true
          git init -q -b docx-layout-results-windows
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "docx-layout results (Windows) for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/docx-layout-results-windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docx-layout-windows
          path: ${{ runner.temp }}/out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docx-layout
          path: /tmp/out
