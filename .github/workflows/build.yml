name: Build Secure Office Suite (Windows/Linux)

on:
  push:
    branches:
      - main
    tags:
      - '**'
  # PRs are expected from same-repo branches only. A fork PR gets a read-only
  # GITHUB_TOKEN and no secrets, so EURO_OFFICE_MIRROR_TOKEN (required to fetch
  # the private submodules + the brand repo) is empty and the build hard-fails.
  pull_request:
  workflow_dispatch:

# Jobs get only the token scopes they list; publish-release is the only one
# that can write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/workplace4cm
  CACHE_IMAGE_NAME: desktopeditors-build-cache
  PRODUCT_VERSION: 9.3.1
  BUILD_NUMBER: dev.1
  BUILD_ROOT: /package

# ─────────────────────────────────────────────────────────────
# BRANDING
#
# Secure Office Suite fork: a single brand, built for amd64 Windows and Linux.
# The Secure Office Suite icons, logos and installer art are committed directly in
# the desktop-apps fork, and the editor theme (web-apps/theme/secure-office-suite)
# in the web-apps fork, so no separate brand repo is checked out here.
# The bake graph still takes three variables:
#
#   BRANDING_DIR   path (relative to the repo root) whose
#                  desktop-apps/package/ tree is overlaid on top of
#                  the upstream packaging tree in
#                  build/.docker/packages.bake.Dockerfile
#   COMPANY_NAME   drives COMPANY_NAME_LOW, the package/output names
#   PRODUCT_NAME   display name baked into the packages
#
# The macOS, arm64 and Nextcloud Office jobs of upstream Euro-Office
# were removed. Without NEXTCLOUD_USER/PASS secrets the third-party
# libraries are built from source instead of fetched from a cache.
# ─────────────────────────────────────────────────────────────

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      product_version:      ${{ steps.meta.outputs.product_version }}
      build_number:         ${{ steps.meta.outputs.build_number }}
      build_number_numeric: ${{ steps.mac.outputs.build_number_numeric }}
      ref_name:             ${{ steps.meta.outputs.ref_name }}
      sha_short:            ${{ steps.meta.outputs.sha_short }}
    steps:
      # Shallow, no submodules — this job only needs the VERSION file.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          token: ${{ github.token }}

      - name: Compute version
        id: meta
        run: |
          REF_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          IS_TAG=${{ startsWith(github.ref, 'refs/tags/') }}

          # Parse PRODUCT_VERSION / BUILD_NUMBER from the git tag.
          # Supported formats:
          #   v9.3.1-stable.1  → product_version=9.3.1  build_number=stable.1
          #   v9.3.1           → product_version=9.3.1  build_number=<env default>
          # Fall back to the VERSION file, then env defaults, for non-tag builds.
          if [[ "$IS_TAG" == "true" && "${{ github.ref_name }}" =~ ^v([^-]+)-(.+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" && "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${{ env.BUILD_NUMBER }}" >> $GITHUB_OUTPUT
          else
            VERSION_FILE=$(cat VERSION.txt 2>/dev/null | tr -d '[:space:]')
            echo "product_version=${VERSION_FILE:-${{ env.PRODUCT_VERSION }}}" >> $GITHUB_OUTPUT
            echo "build_number=${{ env.BUILD_NUMBER }}" >> $GITHUB_OUTPUT
          fi

      # No DocumentServer equivalent — DS has no macOS target. CFBundleVersion
      # accepts only 1-3 dot-separated integers, so 'stable.1' is rejected.
      - name: Derive numeric build number for Xcode
        id: mac
        run: |
          BUILD_NUMBER="${{ steps.meta.outputs.build_number }}"
          NUMERIC="$(printf '%s' "$BUILD_NUMBER" | tr -cd '0-9.' | sed 's/^\.*//; s/\.*$//')"
          [ -n "$NUMERIC" ] || NUMERIC="${GITHUB_RUN_NUMBER}"
          echo "build_number_numeric=${NUMERIC}" >> "$GITHUB_OUTPUT"


  # ─────────────────────────────────────────────────────────────
  # BUILD (common / Linux / Docker / WASM)
  #
  # Produces the brand-specific editors web payload consumed by all
  # three platform jobs. One run per brand.
  # ─────────────────────────────────────────────────────────────


  # ─────────────────────────────────────────────────────────────
  # BRAND ASSETS
  #
  # Renders the brand SVGs into the icon/image tree once, on Linux, and
  # publishes it as an artifact. Each platform job untars it over its
  # checkout before building. Windows and macOS build natively
  # (build.ps1 / xcodebuild), not through Docker, so `COPY --from=brand-icons`
  # isn't available there — the artifact overlay is what lets one render
  # serve all three platforms.
  # ─────────────────────────────────────────────────────────────
  brand-assets:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write          # registry build cache only
    strategy:
      fail-fast: false
      matrix:
        brand:
          - name: secure-office-suite
            extra_bake_files: ""
            cache_prefix: ""
            expect_assets: false          # dummy target: empty overlay by design
    steps:
      - name: Checkout DesktopEditors repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          # The render container's context is the brand repo, not the monorepo,
          # so the multi-GB submodules are pure cost here.
          submodules: false
          token: ${{ github.token }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Render brand assets
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files }}
          targets: brand-icons
          push: false
          set: |
            *.context=..
            brand-icons.tags=
            brand-icons.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}brand-icons-buildcache
            brand-icons.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}brand-icons-buildcache,mode=max
            brand-icons.output=type=local,dest=./brand-assets

      - name: Pack the overlay tree
        run: |
          set -euo pipefail
          OUT=build/brand-assets          # dest above is relative to workdir ./build
          mkdir -p "$OUT"

          # The euro-office dummy (FROM scratch + WORKDIR /keep) exports an empty
          # /keep; drop it so the overlay is a genuine no-op.
          rm -rf "$OUT/keep"

          echo "--- rendered overlay ---"
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort | tee /tmp/manifest.txt

          # Without this, a brand repo that renames its Dockerfile or drops an SVG
          # produces an empty overlay and every downstream job ships unbranded,
          # green. Fail loudly instead.
          if [ "${{ matrix.brand.expect_assets }}" = "true" ] && [ ! -s /tmp/manifest.txt ]; then
            echo "::error::brand-icons produced no files for ${{ matrix.brand.name }}"
            exit 1
          fi

          tar -czf brand-assets.tar.gz -C "$OUT" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets.tar.gz
          if-no-files-found: error
          compression-level: 0          # already gzipped
          retention-days: 7

  build-common:
    runs-on: 'ubuntu-latest'
    needs: [version, brand-assets]
    permissions:
      contents: read
      packages: write          # registry build cache only
    strategy:
      fail-fast: false
      matrix:
        brand:
          - name: secure-office-suite
            image_name: desktop-common
            company_name: Secure Office Suite
            product_name: Desktop Editors
            branding_dir: "."
            extra_bake_files_common: ""
            extra_targets_common: ""
            cache_prefix: ""
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive
          token: ${{ github.token }}

      # The start page and the editors share one set of design tokens; each
      # submodule carries a copy, and the two must not drift apart.
      - name: Check shared design tokens
        run: |
          cmp desktop-apps/common/loginpage/src/sos/tokens.less \
              web-apps/theme/secure-office-suite/assets/less/sos/tokens.less

      # Every template card of the start pages must point at a shipped,
      # well-formed template: the target PCs are offline, so nothing missing
      # can be fetched later. (The engine check runs after build-linux.)
      - name: Check start-page templates
        run: |
          python3 desktop-apps/tools/sos-templates/verify_templates.py \
            --manifest desktop-apps/common/templates/sos/manifest.js

      # Recent documents: per-application lists, pins, removal, crash and
      # upgrade safety of the shell's store (Qt Core only, no engine needed).
      - name: Test recent-document service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev >/dev/null
          t=desktop-apps/win-linux/tests/recentdocuments
          cmake -S "$t" -B /tmp/recentdocuments
          cmake --build /tmp/recentdocuments
          /tmp/recentdocuments/tst_recentdocuments

      # EuroOffice Writer, Sheet, Presentation and PDF: which application a
      # launch or a document belongs to, per-application single-instance,
      # taskbar and data keys, and the installers' file types agree.
      - name: Test application identities
        run: |
          t=desktop-apps/win-linux/tests/appidentity
          cmake -S "$t" -B /tmp/appidentity
          cmake --build /tmp/appidentity
          /tmp/appidentity/tst_appidentity

      # Template library: damaged, missing, wrong-type and macro templates are
      # refused; only library files can be opened; My Templates scan.
      - name: Test template library checks
        run: |
          t=desktop-apps/win-linux/tests/templatelibrary
          cmake -S "$t" -B /tmp/templatelibrary
          cmake --build /tmp/templatelibrary
          /tmp/templatelibrary/tst_templatelibrary

      - name: Debug workspace
        run: |
          echo "workspace: ${{ github.workspace }}"
          echo "brand:     ${{ matrix.brand.name }}"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/build" || echo "build/ MISSING"
          ls -la "${{ github.workspace }}/build/brands/nextcloud-office-brand" || echo "brand/ MISSING"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wasm-cache
        with:
          path: |
            wasm-ccache
            wasm-em-cache
          # Brand-scoped so the two brands don't evict each other's cache.
          key: ${{ runner.os }}-wasm-${{ matrix.brand.name }}-${{ hashFiles('core/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-wasm-${{ matrix.brand.name }}-
            ${{ runner.os }}-wasm-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "wasm-ccache": { "target": "/ccache", "id": "wasm-ccache" },
              "wasm-em-cache": { "target": "/em-cache", "id": "wasm-em-cache" }
            }
          skip-extraction: ${{ steps.wasm-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .

      - name: Build desktop-common
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          # A brand bake file is appended when the brand defines one; empty
          # lines are filtered by bake-action so euro-office sees only the base.
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files_common }}
          # extra_targets_common is either "" or "<target>," so the comma-joined
          # target list resolves correctly for both brands.
          targets: ${{ matrix.brand.extra_targets_common }}desktop-common
          # push=false here; per-target pushing is controlled via tags below.
          push: false
          set: |
            *.context=..
            core-wasm.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache
            core-wasm.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache,mode=max
            core-wasm.tags=
            sdkjs-desktop.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache
            sdkjs-desktop.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache,mode=max
            sdkjs-desktop.tags=
            desktop-js.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache
            desktop-js.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache,mode=max
            desktop-js.tags=
            web-apps.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache
            web-apps.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache,mode=max
            web-apps.tags=
            desktop-common.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache
            desktop-common.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache,mode=max
            desktop-common.tags=${{ format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.image_name, needs.version.outputs.sha_short) }}
            desktop-common.output=type=tar,dest=./common.tar
        env:
          GIT_COMMIT: ${{ needs.version.outputs.sha_short }}
          REGISTRY: ${{ env.REGISTRY }}
          PRODUCT_VERSION: ${{ needs.version.outputs.product_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          # ---- branding ----
          BRANDING_DIR: ${{ matrix.brand.branding_dir }}
          COMPANY_NAME: ${{ matrix.brand.company_name }}
          PRODUCT_NAME: ${{ matrix.brand.product_name }}
          # ------------------
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: ./build/common.tar
          compression-level: 0


  # ─────────────────────────────────────────────────────────────
  # BUILD (Windows)
  #
  # arch × brand. build.ps1 takes -CompanyName / -ProductName; it has
  # no branding-dir overlay yet, so installer artwork still comes from
  # the upstream desktop-apps/win-linux/package tree. See the note at
  # the bottom of the accompanying summary.
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    needs: [version, build-common, brand-assets]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
        brand:
          - name: secure-office-suite
            company_name: Secure Office Suite
            product_name: Desktop Editors
            # Unsigned, packaged here and published to the GitHub release.
            sign: false
    env:
      PYTHONUTF8: "1"
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # ---- orchestration / environment setup (stays in the workflow) ---- #
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive
          token: ${{ github.token }}


      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: . # lands as .\common.tar

      - name: Extract common
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\common | Out-Null
          tar -xf .\common.tar -C .\common   # bsdtar ships with windows-2022/arm runners

      # Install Cygwin WITHOUT touching PATH (the script does the PATH ordering).
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@006ad0b0946ca6d0a3ea2d4437677fa767392401 # v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel

      - name: Install aqtinstall
        shell: pwsh
        run: python -m pip install --upgrade --break-system-packages aqtinstall

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10 # puts sccache on PATH + exports the cache tokens

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11 # exports VCPKG_ROOT for the script

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .

      # ---- build + package (single source of truth: the script) ---- #
      - name: Build & package
        shell: pwsh
        run: |
          $extra = @{}
          if ('${{ matrix.brand.sign }}' -eq 'true') {
            # Packages must be built from signed binaries, so leave that to
            # the signing server.
            $extra.SigningBundle = "${{ github.workspace }}\windows-signing-bundle.tar"
            $extra.SkipPackaging = $true
          }
          .\build\windows\build.ps1 @extra `
            -CommonDir "${{ github.workspace }}\common" `
            -ProductVersion "${{ needs.version.outputs.product_version }}" `
            -BuildNumber "${{ needs.version.outputs.build_number }}" `
            -Arch ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }} `
            -WinSdkVersion  ${{ matrix.arch == 'arm64' && '10.0.22621.0' || '10.0.19041.0' }} `
            -VcToolsVersion '${{ matrix.arch == 'arm64' && '14.44' || '' }}' `
            -Target standalone `
            -CompanyName "${{ matrix.brand.company_name }}" `
            -ProductName "${{ matrix.brand.product_name }}"

      # ---- collect outputs (stays in the workflow) ---- #
      - if: ${{ !matrix.brand.sign }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: |
            desktop-apps/package/zip/*.zip
            desktop-apps/package/inno/*.exe
            desktop-apps/package/advinst/*.msi

      # Input for build/windows/sign-package.ps1 on the signing server, which
      # signs the binaries and builds + signs the ZIP and Inno installer.
      - if: matrix.brand.sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signing-bundle-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: windows-signing-bundle.tar
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # BUILD (Linux)
  #
  # arch × brand. This is where the branding overlay actually bites:
  # packages.bake.Dockerfile does
  #   COPY ${BRANDING_DIR}/desktop-apps/package/ /desktop-editors-package/
  # on top of the upstream packaging tree, and COMPANY_NAME_LOW decides
  # the .deb/.rpm names.
  # ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [version, build-common, brand-assets]
    permissions:
      contents: read
      packages: write          # registry build cache only
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
        brand:
          - name: secure-office-suite
            company_name: Secure Office Suite
            product_name: Desktop Editors
            branding_dir: "."
            extra_bake_files_linux: ""
            extra_targets_linux: ""
            cache_prefix: ""
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive
          token: ${{ github.token }}


      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: ./build/linux

      - name: Extract common
        run: |
          mkdir -p ./build/linux/common
          tar -xf ./build/linux/common.tar -C ./build/linux/common

      - name: Debug workspace
        run: |
          echo "workspace: ${{ github.workspace }}"
          echo "brand:     ${{ matrix.brand.name }}"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/build" || echo "build/ MISSING"
          ls -la "${{ github.workspace }}/build/brands/nextcloud-office-brand" || echo "brand/ MISSING"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Restore desktop build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: desktop-cache
        with:
          path: |
            ccache
            nuget-cache
          key: ${{ runner.os }}-desktop-${{ matrix.brand.name }}-${{ matrix.arch }}-${{ hashFiles('core/vcpkg.json', 'desktop-apps/win-linux/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-desktop-${{ matrix.brand.name }}-${{ matrix.arch }}-
            ${{ runner.os }}-desktop-

      - name: Inject caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": { "target": "/ccache", "id": "ccache" },
              "nuget-cache": { "target": "/nuget-cache", "id": "nuget-cache" }
            }
          skip-extraction: ${{ steps.desktop-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .


      - name: Build packages
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build/linux
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files_linux }}
          targets: ${{ matrix.brand.extra_targets_linux }}packages
          push: false
          set: |
            *.context=../..
            core-base.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache
            core-base.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache,mode=max
            core-base.tags=
            desktop-linux.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-linux-buildcache
            desktop-linux.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-linux-buildcache,mode=max
            desktop-linux.tags=
            desktop-linux.contexts.desktop-common=./common
            packages.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}packages-buildcache
            packages.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}packages-buildcache,mode=max
            packages.tags=
        env:
          GIT_COMMIT: ${{ needs.version.outputs.sha_short }}
          REGISTRY: ${{ env.REGISTRY }}
          PRODUCT_VERSION: ${{ needs.version.outputs.product_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          # ---- branding ----
          BRANDING_DIR: ${{ matrix.brand.branding_dir }}
          COMPANY_NAME: ${{ matrix.brand.company_name }}
          PRODUCT_NAME: ${{ matrix.brand.product_name }}
          # ------------------
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: |
            build/linux/deploy/packages/*.deb
            build/linux/deploy/packages/*.rpm
            build/linux/deploy/packages/*.tar.xz


  # ─────────────────────────────────────────────────────────────
  # Every template the Linux package ships is opened, saved as a
  # document and reopened with the package's own converter, with no
  # network: templates must be real and work offline.
  # ─────────────────────────────────────────────────────────────
  verify-templates:
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - name: Check out desktop-apps
        run: git submodule update --init --depth 1 desktop-apps

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-secure-office-suite-amd64
          path: packages

      - name: Unpack the packages
        run: for deb in packages/*.deb; do dpkg -x "$deb" pkg; done

      - name: Open, save and reopen every shipped template
        run: |
          conv=$(dirname "$(find pkg -name x2t -type f | head -1)")
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" python3 desktop-apps/tools/sos-templates/verify_templates.py \
            --manifest "$conv/templates/sos/manifest.js" \
            --engine "$(dirname "$conv")" --work "$RUNNER_TEMP/templates"

  # ─────────────────────────────────────────────────────────────
  # The four applications from the installed .deb, on a virtual
  # display: a document opens directly in its application, each starts
  # on its own start page in its own process with its own window
  # identity, a second launch reaches the running one, and documents
  # given to the wrong application open in the right one.
  # ─────────────────────────────────────────────────────────────
  verify-apps:
    runs-on: ubuntu-24.04
    needs: [build-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - name: Check out desktop-apps
        run: git submodule update --init --depth 1 desktop-apps

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-secure-office-suite-amd64
          path: packages

      - name: Install the package and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool x11-utils imagemagick desktop-file-utils libglib2.0-bin xdg-user-dirs >/dev/null
          deb=$(ls packages/*.deb | grep -v -- -help | head -1)
          echo "DEB=$PWD/$deb" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq "./$deb" >/dev/null

      - name: Launch the four applications
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          Xvfb :99 -screen 0 1600x1000x24 & sleep 3
          openbox & sleep 2
          desktop-apps/tools/sos-apps/verify_apps.sh secure-office-suite-desktopeditors "$RUNNER_TEMP/apps"

      # menus, icons, default applications and double-click for DOC, DOCX,
      # ODT, RTF, TXT, XLS, XLSX, ODS, CSV, PPT, PPTX, ODP and PDF, desktop
      # shortcuts, then upgrade, remove and purge keeping user data
      - name: Ubuntu integration
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          desktop-apps/tools/sos-apps/verify_integration.sh secure-office-suite-desktopeditors "$DEB" "$RUNNER_TEMP/apps/integration"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-apps
          path: ${{ runner.temp }}/apps

  # ─────────────────────────────────────────────────────────────
  # Windows integration from the real installer: four Start Menu
  # entries and desktop shortcuts, icons, Default Apps, the file types
  # (DOC, DOCX, ODT, RTF, TXT -> Writer; XLS, XLSX, ODS, CSV -> Sheet;
  # PPT, PPTX, ODP -> Presentation; PDF -> PDF) opened by double-click,
  # then an upgrade and a silent uninstall that keep user data.
  # ─────────────────────────────────────────────────────────────
  verify-windows:
    runs-on: windows-2022
    timeout-minutes: 75
    needs: [build-windows]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - name: Check out desktop-apps
        run: git submodule update --init --depth 1 desktop-apps

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-packages-secure-office-suite-amd64
          path: packages

      - name: Install, use, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem packages -Recurse -Filter '*.exe' | Select-Object -First 1
          desktop-apps/tools/sos-apps/verify_windows.ps1 -Installer $setup.FullName -Out "$env:RUNNER_TEMP\windows"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-windows
          path: ${{ runner.temp }}/windows

  # ─────────────────────────────────────────────────────────────
  # Classify the tag: v9.3.4-1 is stable; anything else
  # (v9.3.4-beta.1, v9.3.4-rc.1, v9.3.1-dev.1, ...) is a prerelease.
  # ─────────────────────────────────────────────────────────────
  release-info:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      stable: ${{ steps.check.outputs.stable }}
    steps:
      - id: check
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────
  # PUBLISH - Secure Office Suite to GitHub Release (this repository)
  # ─────────────────────────────────────────────────────────────
  publish-release:
    runs-on: ubuntu-latest
    needs: [release-info, build-linux, build-windows, verify-templates]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-packages-secure-office-suite-*'
          path: dist
          merge-multiple: true

      - run: find dist -type f -printf '%p  %s bytes\n' | sort

      # The installer is not code-signed yet, so publish checksums people can
      # compare against before running it.
      - name: Write SHA256SUMS
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**/*
          prerelease: ${{ needs.release-info.outputs.stable != 'true' }}
          fail_on_unmatched_files: true



